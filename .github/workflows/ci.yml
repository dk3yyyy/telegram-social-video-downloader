name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: downloader/requirements-dev.txt
      - run: pip install -r downloader/requirements-dev.txt
      - run: pytest
      - run: node scripts/test-workflow-parser.mjs
      - run: ruff check downloader
      - run: ruff format --check downloader
      - run: bandit -q -r downloader/app
      - run: pip-audit -r downloader/requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag telegram-social-video-downloader:test downloader
      - name: Smoke-test container health
        run: |
          docker run --detach --name downloader-smoke \
            --env DOWNLOADER_API_KEY="$(printf 'x%.0s' {1..24})" \
            --env TELEGRAM_BOT_TOKEN="123456:$(printf 'x%.0s' {1..24})" \
            --env DATABASE_PATH=/tmp/jobs.sqlite3 \
            telegram-social-video-downloader:test

          for attempt in {1..30}; do
            if docker exec downloader-smoke python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"; then
              exit 0
            fi
            sleep 1
          done

          docker logs downloader-smoke
          exit 1
      - if: always()
        run: docker rm --force downloader-smoke || true
